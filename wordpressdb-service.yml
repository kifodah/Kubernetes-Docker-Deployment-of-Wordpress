#  wordpressdb-service.yml
#  Contains: WordPress NodePort Service
#  Access WordPress at: http://<node-ip>:30020

apiVersion: v1
kind: Service
metadata:
  name: frontend-worpress-app
spec:
  type: NodePort
  selector:
    app: wordpress-frontend       
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30020
